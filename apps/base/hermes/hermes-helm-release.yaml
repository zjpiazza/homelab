apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: hermes
  namespace: hermes
spec:
  interval: 15m
  timeout: 10m
  targetNamespace: hermes
  releaseName: hermes
  chart:
    spec:
      # Chart lives at the repo root; no chart name is needed when using
      # a GitRepository source pointed at a single chart, but the field is
      # required by the schema, so we pass the chart directory ("."):
      chart: "."
      sourceRef:
        kind: GitRepository
        name: hermes-agent-helm-chart
        namespace: flux-system
      reconcileStrategy: Revision
  install:
    crds: CreateReplace
    # Retry failed installs via upgrade; uninstall remediation would delete
    # the chart-owned data PVC, which has no Helm keep policy.
    strategy:
      name: RetryOnFailure
      retryInterval: 5m
  upgrade:
    crds: CreateReplace
    remediation:
      retries: 2
  values:
    # --- State safety (chart defaults; kept explicit for clarity) ---
    replicaCount: 1
    strategy:
      type: Recreate

    image:
      repository: nousresearch/hermes-agent
      # Nearest published release after the former 2026-05-14 SHA tag.
      # Pin the multi-arch digest: upstream no longer publishes that SHA tag.
      tag: "v2026.5.16@sha256:b6e41c155d6bfce5ad83c5d0fec670086db8a43250e4511c9474134be5482d33"
      pullPolicy: IfNotPresent

    # --- Secrets: managed out-of-band via kubectl ---
    # Create / update with:
    #   kubectl -n hermes create secret generic hermes-secrets \
    #     --from-literal=OPENROUTER_API_KEY=sk-or-... \
    #     --from-literal=TELEGRAM_BOT_TOKEN=123456:ABC... \
    #     --dry-run=client -o yaml | kubectl apply -f -
    # The chart wires every key in this Secret onto the pod as an env var
    # via envFrom, so adding a new key + restarting the pod is enough.
    secrets:
      existingSecret: hermes-secrets

    # --- Messaging platform allowlists & runtime env ---
    # Telegram auto-enables when TELEGRAM_BOT_TOKEN is set in the Secret.
    # We must override the chart default env map (not use extraEnv) because
    # Kubernetes server-side apply rejects duplicate env keys, and the
    # chart already renders TELEGRAM_ALLOWED_USERS="" from its defaults.
    # When overriding env, the full map replaces the chart defaults, so
    # re-list every key we care about keeping.
    env:
      WEB_TOOLS_DEBUG: "false"
      VISION_TOOLS_DEBUG: "false"
      MOA_TOOLS_DEBUG: "false"
      IMAGE_TOOLS_DEBUG: "false"
      HERMES_HUMAN_DELAY_MODE: "off"
      HERMES_HUMAN_DELAY_MIN_MS: "800"
      HERMES_HUMAN_DELAY_MAX_MS: "2500"
      GATEWAY_ALLOW_ALL_USERS: "false"
      WHATSAPP_ENABLED: "false"
      WHATSAPP_ALLOWED_USERS: ""
      TELEGRAM_ALLOWED_USERS: "6786828227"
      TELEGRAM_HOME_CHANNEL: ""
      DISCORD_ALLOWED_USERS: "151864862186799104"
      DISCORD_HOME_CHANNEL: ""
      SLACK_ALLOWED_USERS: ""
      SIGNAL_ALLOWED_USERS: ""
      SIGNAL_GROUP_ALLOWED_USERS: ""
      # Load messaging and speech dependencies from the PVC; the image's root
      # filesystem is read-only, so runtime lazy installation cannot modify it.
      PYTHONPATH: "/opt/data/python-packages"
      # Keep the local Whisper model cache across pod replacements.
      HF_HOME: "/opt/data/cache/huggingface"

    # --- Install messaging and speech Python deps into the PVC ---
    # Keep this image aligned with image.tag above and match its dependency pins.
    extraInitContainers:
      - name: install-messaging-deps
        image: nousresearch/hermes-agent:v2026.5.16@sha256:b6e41c155d6bfce5ad83c5d0fec670086db8a43250e4511c9474134be5482d33
        imagePullPolicy: IfNotPresent
        command: ["/bin/sh", "-ec"]
        args:
          - |
            set -eu
            TARGET=/opt/data/python-packages
            mkdir -p "$TARGET"
            # --target installs into a directory rather than a venv.
            # --system flag tells uv not to require an active venv.
            # Match the runtime's uv.lock: PyAV 19 removed metadata_errors,
            # which faster-whisper 1.2.1 still passes when decoding audio.
            uv pip install --system --target "$TARGET" \
              "python-telegram-bot[webhooks]==22.6" \
              "discord.py[voice]==2.7.1" \
              "aiohttp==3.13.3" \
              "brotlicffi==1.2.0.1" \
              "faster-whisper==1.2.1" \
              "av==17.0.0" \
              "numpy==2.4.3" \
              "edge-tts==7.2.7"
            echo "Installed messaging deps to $TARGET:"
            ls "$TARGET" | head -20
        env:
          - name: HOME
            value: /opt/data/home
          # Keep uv's cache in the writable tmp volume rather than HOME,
          # which is also used by the chart's bootstrap and main containers.
          - name: UV_CACHE_DIR
            value: /tmp/uv-cache
        volumeMounts:
          - name: data
            mountPath: /opt/data
          - name: tmp
            mountPath: /tmp
        securityContext:
          runAsUser: 10000
          runAsGroup: 10000

    # --- Persistence via Rook-Ceph block storage ---
    persistence:
      enabled: true
      mountPath: /opt/data
      accessMode: ReadWriteOnce
      size: 20Gi
      storageClass: rook-ceph-block

    # --- Hermes runtime config ---
    config:
      values:
        model:
          default: anthropic/claude-opus-4.6
          provider: auto
          base_url: https://openrouter.ai/api/v1
        stt:
          provider: local
          local:
            model: base
        tts:
          provider: edge
          edge:
            voice: en-US-AriaNeural
        agent:
          max_turns: 90
          gateway_timeout: 1800
          restart_drain_timeout: 60
          tool_use_enforcement: auto
        terminal:
          backend: local
          cwd: .
          timeout: 180
        compression:
          enabled: true
        security:
          redact_secrets: true

    # --- Resources sized for parallel subagent workloads ---
    resources:
      requests:
        cpu: "1"
        memory: 2Gi
      limits:
        cpu: "4"
        memory: 8Gi

    browser:
      shm:
        enabled: true
        sizeLimit: 2Gi

    # --- No external exposure for now ---
    service:
      enabled: false
    ingress:
      enabled: false
    virtualService:
      enabled: false

    # --- Default to gateway mode (chart default args: gateway run) ---
    apiServer:
      enabled: false
    webhook:
      enabled: false
    telegramWebhook:
      enabled: false
